name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Database via PostgREST
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "❌ Error: SUPABASE_URL or SUPABASE_KEY secret is missing in GitHub Repository Secrets."
            exit 1
          fi

          echo "Pinging Supabase at: ${SUPABASE_URL}/rest/v1/Category?select=id&limit=1"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${SUPABASE_URL}/rest/v1/Category?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase database is active and keep-alive ping succeeded (HTTP $HTTP_STATUS)."
          else
            echo "❌ Keep-alive failed with HTTP $HTTP_STATUS."
            exit 1
          fi
